# ============================================================
# Lengbanlist 自定义模型示例文件
# ============================================================
# 使用方法：
# 1. 将此文件复制到插件数据目录的 models/ 子目录下（Bukkit 为 plugins/Lengbanlist/models/，Fabric 为 config/Lengbanlist/models/）
# 2. 重命名为你喜欢的名字（如 mymodel.yml）
# 3. 修改下面的 name 和 messages 内容
# 4. 执行 /lban reload 或重启服务器即可加载
#
# 注意事项：
# - 模型名称不能与内置模型冲突
# - 内置模型列表：Default, English, HuTao, Furina, Zhongli,
#   Keqing, Xiao, Ayaka, Zero, Herta, Nahida, Klee, YaeMiko
# - 如果名称冲突，自定义模型不会被加载（内置模型优先）
# - 支持 Minecraft 颜色代码（§0-§f, §l, §n, §o 等）
#
# 可用占位符：
#   {player}    - 玩家名
#   {reason}    - 处罚原因
#   {days}      - 天数（永久封禁自动显示为"永久"）
#   {ip}        - IP 地址
#   {count}     - 数量（如警告次数、记录条数）
#   {enabled}   - 自动替换为"开启"或"关闭"
#   {type}      - 处罚类型（如"封禁"、"禁言"）
#   {target}    - 目标名称
#   {remaining} - 剩余时间
#   {duration}  - 处罚时长
#   {detail}    - 详细信息
#   {entry}     - 历史记录条目
#   {version}   - 插件版本号（可用于 help 帮助菜单）
#   {actor}     - 操作人（回滚）
#   {time}      - 时间范围（回滚）
#   {matched}   - 匹配条数（回滚）
#   {executed}  - 成功执行条数（回滚）
#   {skipped}   - 跳过条数（回滚）
# ============================================================

# 模型名称（唯一标识，不能与内置模型重名）
name: "MyCustomModel"

# 帮助菜单（显示在 /lban 或 /lban help 中）
# 每行一个字符串，支持颜色代码
# 以下内容复制自内置 Default 模型的帮助文本，可自行修改
help:
  - "§b╔══════════════════════════════════╗"
  - "§b║ §2§oLengbanlist 帮助 - example-custom-model风格 §b║"
  - "§b╠══════════════════════════════════╣"
  - "§6§l◆ 处罚管理"
  - "§2✦ §b/lban add <可选>-s <必填>玩家名 <必填>天数 <必填>原因 §7- §3添加封禁"
  - "§7  = §b/ban"
  - "§2✦ §b/ban-ip <可选>-s <必填>IP地址 <必填>天数 <必填>原因 §7- §3封禁 IP 地址"
  - "§2✦ §b/lban mute <可选>-s <必填>玩家名 <必填>原因 §7- §3禁言玩家"
  - "§7  = §b/mute"
  - "§2✦ §b/lban unmute <可选>-s <必填>玩家名 §7- §3解除禁言"
  - "§7  = §b/unmute"
  - "§2✦ §b/lban warn <必填>玩家名 <必填>原因 §7- §3警告玩家，三次警告将自动封禁"
  - "§7  = §b/warn"
  - "§2✦ §b/lban unwarn <必填>玩家名 §7- §3移除玩家警告"
  - "§7  = §b/unwarn"
  - "§2✦ §b/kick <必填>玩家名 <可选>原因 §7- §3踢出玩家"
  - "§2✦ §b/setban <必填>玩家名/IP <必填>时间/forever/auto <必填>原因 §7- §3修改封禁时间"
  - "§6§l◆ 查询信息"
  - "§2✦ §b/lban check <必填>玩家名/IP §7- §3检查封禁状态"
  - "§2✦ §b/lban history <必填>玩家名 §7- §3查询处罚历史"
  - "§7  = §b/history"
  - "§2✦ §b/report <必填>玩家名 <必填>原因 §7- §3举报玩家"
  - "§2✦ §b/lban getip <可选>玩家名 §7- §3查询玩家 IP 地址"
  - "§2✦ §b/lban alts <必填>玩家名 §7- §3查询同IP小号"
  - "§2✦ §b/lban audit <可选>操作人 §7- §3查看审计日志"
  - "§2✦ §b/lban audit export §7- §3导出审计日志"
  - "§2✦ §b/lban audit verify §7- §3校验审计完整性"
  - "§2✦ §b/lban sync §7- §3查看跨服同步状态"
  - "§2✦ §b/lban rollback <操作人> <开始时间> <结束时间> <可选>操作类型 §7- §3回滚管理员操作"
  - "§6§l◆ 杂项"
  - "§2✦ §b/lban list §7- §3查看封禁名单"
  - "§2✦ §b/lban list-mute §7- §3查看禁言列表"
  - "§7  = §b/listmute"
  - "§2✦ §b/lban a §7- §3广播封禁人数"
  - "§2✦ §b/lban toggle §7- §3开关自动广播"
  - "§2✦ §b/lban open §7- §3打开可视化操作界面"
  - "§2✦ §b/lban model <必填>模型名称 §7- §3切换模型"
  - "§2✦ §b/lban reload §7- §3重新加载配置"
  - "§2✦ §b/lban info §7- §3查看插件信息"
  - "§b╚══════════════════════════════════╝"
  - "§2♡ 当前版本: {version} §7| §b模型: example-custom-model"

# 消息模板（所有消息均可自定义）
messages:
  # --- 踢出相关 ---
  get-kick-message: "§c你被踢出服务器了！\n原因: {reason}\n§c请遵守服务器规则！"
  on-kick-success: "§a玩家 {player} 已被踢出！原因: {reason}"

  # --- 广播开关 ---
  toggle-broadcast: "§a自动广播已{enabled}"

  # --- 重载配置 ---
  reload-config: "§a配置已重新加载"

  # --- 封禁相关 ---
  add-ban: "§a玩家 {player} 已被封禁 {days}，原因: {reason}"
  remove-ban: "§a玩家 {player} 已解封"
  add-ban-ip: "§aIP {ip} 已被封禁 {days}，原因: {reason}"
  remove-ban-ip: "§aIP {ip} 已解封"

  # --- 禁言相关 ---
  add-mute: "§a玩家 {player} 已被禁言，原因: {reason}"
  remove-mute: "§a玩家 {player} 已解除禁言"
  mute-command-blocked: "§c你正在被禁言，无法使用此命令"

  # --- 警告相关 ---
  add-warn: "§a玩家 {player} 已被警告，原因: {reason}（三次警告自动封禁）"
  remove-warn: "§a玩家 {player} 的警告已移除"
  warn-offline: "§a离线玩家 {player} 已被警告，原因: {reason}，上线后他将收到通知"
  pending-warnings-notice: "§e你有 {count} 条待处理警告，请遵守规则！"

  # --- 过期提醒 ---
  expiry-reminder: "§a{target} 的{type}将在 {remaining} 后到期"

  # --- 处罚升级（LBAC自动封禁） ---
  escalated-ban: "§a玩家 {player} 因第 {count} 次违规，处罚已自动升级为封禁 {duration}"

  # --- 小号查询 ---
  alts-result: "§a玩家 {player} 名下查到 {count} 个小号："
  no-alts: "§a玩家 {player} 没有查到小号，是干净的好玩家"

  # --- 举报相关 ---
  on-report-ban: "§a举报已确认！玩家 {player} 已被封禁 {duration}"

  # --- 审计日志导出 ---
  export-result: "§a审计日志导出成功，共 {count} 条记录"

  # --- 审计校验 ---
  verify-result-valid: "§a审计校验通过！{count} 条记录完整无损"
  verify-result-invalid: "§c审计校验失败！{count} 条记录可能被篡改"

  # --- 跨服同步 ---
  sync-status: "§a跨服同步状态: {detail}"

  # --- 权限拒绝 ---
  immunity-denied: "§c目标 {target} 的权限等级不低于你，无法执行此操作"

  # --- 操作回滚（/lban rollback） ---
  rollback-preview: "§a操作人 {actor} 在 {time} 共有 {count} 条可回滚操作记录"
  rollback-result: "§a回滚完成！匹配 {matched} 条，成功执行 {executed} 条，跳过 {skipped} 条"
  rollback-no-records: "§a操作人 {actor} 在指定范围内没有可回滚的操作记录"

  # --- 历史记录模板 ---
  history-header: "§a玩家 {player} 的处罚历史："
  history-empty: "§a玩家 {player} 没有任何处罚记录，是遵纪守法的好玩家"
  history-entry-format: "§7{entry}"
