    §b╔══════════════════════════╗
    §b║   §dEnglish Model Kick Notice  §b║
    §b╠══════════════════════════╣
    §d☠️ You have been kicked from the server!
    
    §7Reason: §f{reason}
    
    §dPlease follow the rules next time~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ English Model: §a{player} §ehas been kicked!
    §bReason: §f{reason}
    §bMaintaining order, no disruption allowed! §b(◕‿◕✿)
