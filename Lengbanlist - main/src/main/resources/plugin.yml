name: Lengbanlist
main: org.leng.Lengbanlist
version: ${project.version}
api-version: 1.21
folia-supported: true
softdepend:
  - PlaceholderAPI
  - LuckPerms
authors: 
  - Serendisand
description: >
  This plugin provides a lightweight ban and query system for high-version Minecraft servers.


  Permission semantics (重要): `/lban <sub>` 入口与独立命令入口 (`/ban`, `/mute` 等) 共享权限节点,
  但路由器层会在 `/lban <sub>` 入口接受宽松检查,具体节点校验由独立命令类负责。
  关键映射:
    /lban add <玩家>   → lengbanlist.ban
    /lban add <IP>     → lengbanlist.banip
    /lban remove       → lengbanlist.unban
    /lban mute/unmute  → lengbanlist.mute
    /lban warn/unwarn  → lengbanlist.warn / lengbanlist.unwarn
    /lban getip        → lengbanlist.getip
  注意: `/lban add <IP>` 必须授予 `lengbanlist.banip`（与独立 `/ban-ip` 一致）。
commands:
  lban:
    description: 主命令
    usage: /<command> <必填>子命令
  ban:
    description: 封禁玩家
    usage: /<command> <可选>-s <必填>玩家名 <必填>时间/auto <必填>理由
    permission: lengbanlist.ban
  ban-ip:
    description: 封禁 IP
    usage: /<command> <可选>-s <必填>IP <必填>时间/auto <必填>理由
    permission: lengbanlist.banip
  unban:
    description: 解封玩家
    usage: /<command> <必填>玩家名/IP
    permission: lengbanlist.unban
  warn:
    description: 警告玩家
    usage: /<command> <必填>玩家名 <必填>理由
    permission: lengbanlist.warn
  unwarn:
    description: 移除警告
    usage: /<command> <必填>玩家名 <可选>警告ID
    permission: lengbanlist.unwarn
  check:
    description: 检查玩家或 IP 的封禁状态
    usage: /<command> <必填>玩家名/IP
    permission: lengbanlist.check
  report:
    description: 举报玩家
    usage: /<command> <必填>玩家名 <必填>理由
    permission: lengbanlist.report
  admin:
    description: 管理举报
    usage: /<command> <必填>子命令
    permission: lengbanlist.admin
  info:
    description: 显示插件信息
    usage: /<command>
    permission: lengbanlist.info
  kick:
    description: 踢出玩家
    usage: /<command> <必填>玩家名 <可选>理由
    permission: lengbanlist.kick
  allowmsg:
    description: 允许玩家发送消息
    usage: /<command> <必填>玩家名
    permission: lengbanlist.allowmsg
  warnmsg:
    description: 警告玩家发送违规消息
    usage: /<command> <必填>玩家名
    permission: lengbanlist.warnmsg
  setban:
    description: 设置玩家的封禁时间
    usage: /<command> <必填>玩家名/IP <必填>时间/forever/auto <必填>理由
    permission: lengbanlist.setban
  history:
    description: 查询玩家的处罚历史
    usage: /<command> <必填>玩家名
    permission: lengbanlist.history
  mute:
    description: 禁言玩家
    usage: /<command> <可选>-s <必填>玩家名 <必填>时间/auto <必填>原因
    permission: lengbanlist.mute
  unmute:
    description: 解除禁言
    usage: /<command> <可选>-s <必填>玩家名
    permission: lengbanlist.mute
  listmute:
    description: 查看禁言列表
    usage: /<command>
    permission: lengbanlist.listmute
  getip:
    description: 查询玩家 IP 地理位置
    usage: /<command> <可选>玩家名
    permission: lengbanlist.getip
  sc:
    description: 工作频道聊天
    usage: /<command> <必填>内容
    permission: lengbanlist.staffchat
  alts:
    description: 查询玩家同IP小号
    usage: /<command> <必填>玩家名
    permission: lengbanlist.alts
permissions:
  lengbanlist.ban:
    description: 允许使用封禁玩家命令
    default: op
  lengbanlist.banip:
    description: 允许使用封禁 IP 命令
    default: op
  lengbanlist.unban:
    description: 允许使用解封玩家命令
    default: op
  lengbanlist.warn:
    description: 允许使用警告玩家命令
    default: op
  lengbanlist.unwarn:
    description: 允许使用移除警告命令
    default: op
  lengbanlist.check:
    description: 允许使用检查封禁状态命令
    default: op
  lengbanlist.report:
    description: 允许使用举报玩家命令
    default: true
  lengbanlist.admin:
    description: 允许使用管理举报命令
    default: op
  lengbanlist.info:
    description: 允许使用显示插件信息命令
    default: op
  lengbanlist.kick:
    description: 允许使用踢出玩家命令
    default: op
  lengbanlist.allowmsg:
    description: 允许使用允许玩家发送消息命令
    default: op
  lengbanlist.warnmsg:
    description: 允许使用警告玩家发送违规消息命令
    default: op
  lengbanlist.setban:
    description: 允许使用设置封禁时间命令
    default: op
  lengbanlist.history:
    description: 允许使用查询处罚历史命令
    default: op
  lengbanlist.getip:
    description: 允许使用查询玩家 IP 地理位置命令
    default: op
  lengbanlist.staffchat:
    description: 允许使用工作频道聊天命令
    default: op
  lengbanlist.audit:
    description: 允许查看审计日志
    default: op
  lengbanlist.alts:
    description: 允许查询同IP小号
    default: op
  lengbanlist.export:
    description: 允许导出与校验审计日志
    default: op
  lengbanlist.sync:
    description: 允许查看跨服同步状态
    default: op
  lengbanlist.mute:
    description: 允许使用禁言玩家命令
    default: op
  lengbanlist.listmute:
    description: 允许使用查看禁言列表命令
    default: op
  lengbanlist.open:
    description: 允许打开可视化操作界面
    default: op
  lengbanlist.model:
    description: 允许切换插件角色模型
    default: op
  lengbanlist.reload:
    description: 允许重载插件配置
    default: op
  lengbanlist.toggle:
    description: 允许开关全局广播
    default: op
  lengbanlist.list:
    description: 允许查看封禁/处罚列表
    default: op
  lengbanlist.help:
    description: 允许查看命令帮助
    default: op
  lengbanlist.broadcast:
    description: 允许发送插件广播
    default: op
  lengbanlist.rollback:
    description: 允许回滚指定管理员的操作
    default: op